name: Cake Tests

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep Mint's package store inside the workspace so it is cacheable and
  # independent of where Homebrew lives (/usr/local vs /opt/homebrew).
  MINT_PATH: ${{ github.workspace }}/.mint/packages
  MINT_LINK_PATH: ${{ github.workspace }}/.mint/bin

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Select Xcode
        run: |
          # The project targets the iOS 27 SDK, so prefer Xcode 27 and fall back
          # to the newest Xcode on the image if the runner hasn't got it yet.
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          "$xcode/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Cache Mint packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.mint
          key: ${{ runner.os }}-mint-${{ hashFiles('CookSmart/BuildTools/Mintfile') }}
          restore-keys: ${{ runner.os }}-mint-

      - name: Install Mint
        run: brew install mint

      - name: Mint Bootstrap
        working-directory: CookSmart/BuildTools
        run: mint bootstrap -v

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: CookSmart
          bundler-cache: true

      - name: Run Tests
        working-directory: CookSmart
        run: bundle exec fastlane testlane
